<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L01-08 fixed-candidate caption clearance</title>
<style>
  body{margin:0;background:#f5f7f9;color:#102337;font:16px Arial,sans-serif}
  main{max-width:1280px;margin:20px auto;padding:0 16px}
  h1{font-size:20px;margin:0 0 12px}
  video{display:block;width:100%;background:#071b2a}
  .band{display:none;margin-top:8px;padding:12px 18px;border-radius:6px;background:#0e2033;color:white;text-align:center;font-size:18px;line-height:1.5;white-space:pre-line}
  .band:not(:empty){display:block}
  .controls{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{min-height:36px;border:1px solid #738293;border-radius:5px;background:white;color:#102337;cursor:pointer}
  button[aria-pressed="true"]{border:2px solid #183951;background:#ebc15c}
  .sizes{display:flex;gap:5px}
  .sizes button{min-width:42px}
  .sizes [data-size="S"]{font-size:14px}
  .sizes [data-size="M"]{font-size:18px}
  .sizes [data-size="L"]{font-size:24px}
  [hidden]{display:none!important}
  small{display:block;margin-top:12px;color:#405468}
</style>
<main>
  <h1>L01-08 fixed-candidate caption review</h1>
  <video id="clip" controls playsinline preload="metadata"><source id="source" type="video/mp4"><track id="track" kind="captions" srclang="en" label="English" default></video>
  <div id="band" class="band" role="status" aria-label="L06 candidate caption"></div>
  <div class="controls"><button id="toggle" aria-pressed="true">English captions on</button><div class="sizes" role="group" aria-label="Caption size"><button data-size="S" aria-label="Small captions" aria-pressed="false">Aa</button><button data-size="M" aria-label="Medium captions" aria-pressed="true">Aa</button><button data-size="L" aria-label="Large captions" aria-pressed="false">Aa</button></div></div>
  <small>Review-only candidate bytes from PR #1290 at 55ebd09c. This page does not bind media to learners.</small>
</main>
<script>
  const layout = new URLSearchParams(location.search).get('layout') === 'mobile' ? 'mobile' : 'desktop'
  const video = document.getElementById('clip')
  const track = document.getElementById('track')
  const band = document.getElementById('band')
  const toggle = document.getElementById('toggle')
  const sizes = document.querySelector('.sizes')
  document.getElementById('source').src = `L01-08-${layout}.mp4`
  track.src = `L01-08-${layout}.vtt`
  let enabled = true
  let size = 'M'
  const sync = () => {
    if (video.textTracks[0]) video.textTracks[0].mode = enabled ? 'hidden' : 'disabled'
    const cues = [...(video.textTracks[0]?.cues ?? [])]
    band.textContent = enabled ? cues.filter(cue => cue.startTime <= video.currentTime && video.currentTime < cue.endTime).map(cue => cue.text).join('\n') : ''
    band.style.fontSize = {S:'14px',M:'18px',L:'24px'}[size]
    toggle.textContent = enabled ? 'English captions on' : 'English captions off'
    toggle.setAttribute('aria-pressed', String(enabled))
    sizes.hidden = !enabled
    for (const button of sizes.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.size === size))
  }
  toggle.addEventListener('click', () => { enabled = !enabled; sync() })
  sizes.addEventListener('click', event => { if (event.target.dataset.size) { size = event.target.dataset.size; sync() } })
  for (const event of ['loadedmetadata','timeupdate','seeking','seeked','pause','ended']) video.addEventListener(event, sync)
  track.addEventListener('load', sync)
  video.load()
  sync()
</script>
