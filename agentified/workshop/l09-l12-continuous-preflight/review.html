<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L09–L12 continuous narration preflight</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f7f1df;background:#111a22}*{box-sizing:border-box}body{margin:0;padding:24px}.shell{max-width:1200px;margin:auto}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#dfba68}.top h1{font-size:22px;margin:0 auto 0 0}.controls{display:flex;gap:8px;flex-wrap:wrap}select,button{font:inherit;background:#263541;color:#fff;border:1px solid #677585;border-radius:8px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{border-color:#e2b85b;background:#554321}.stage{aspect-ratio:16/9;min-height:380px;background:radial-gradient(circle at 80% 10%,#2c4050,#111b25 68%);border:1px solid #6f6858;border-radius:18px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:28px;padding:48px;overflow:hidden}.copy{display:flex;flex-direction:column;justify-content:center;min-width:0}.scene{color:#e4bd6e;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.copy h2{font-size:clamp(27px,4vw,52px);line-height:1.05;margin:16px 0;max-width:13ch}.copy p{font-size:clamp(16px,1.7vw,22px);line-height:1.45;margin:0;max-width:48ch}.visual{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#182632;border:1px solid #4c5d69;padding:18px}.visual img{display:block;width:100%;height:100%;object-fit:contain}.placeholder{max-width:36ch;text-align:center;color:#d9cdae;font-size:20px;line-height:1.4}.timer{font-size:clamp(74px,12vw,164px);font-variant-numeric:tabular-nums;line-height:1;color:#e4bd6e}.caption{background:#0a1018;border:1px solid #62605d;padding:14px 18px;min-height:58px;text-align:center;font-size:18px;line-height:1.4;border-radius:10px;margin-top:12px}.meta{font-size:12px;color:#c8cbd0;line-height:1.5;margin:12px 0}.meta code{color:#e7bd66}.warning{color:#f4d497;font-size:13px}.hidden{display:none}@media(max-width:700px){body{padding:10px}.top h1{font-size:17px}.stage{min-height:580px;aspect-ratio:auto;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:20px}.copy h2{font-size:30px;margin:10px 0}.copy p{font-size:16px}.visual{min-height:0;padding:8px}.caption{font-size:15px}.placeholder{font-size:17px}}
</style></head><body><main class="shell"><div class="top"><div><div class="tag">Internal review · provider-free</div><h1>Agentified L09–L12 preflight</h1></div><div class="controls"><label>Lesson <select id="lesson"><option>L09</option><option>L10</option><option>L11</option><option>L12</option></select></label><button data-state="opening">Opening</button><button data-state="plate">Approved plate</button><button data-state="exercise">Guided work</button><button data-state="closing">Closing</button></div></div><section class="stage" aria-label="Review frame"><div class="copy"><div class="scene" id="scene"></div><h2 id="title"></h2><p id="body"></p></div><div class="visual" id="visual"></div></section><div class="caption" id="caption" aria-live="polite"></div><p class="meta" id="source"></p><p class="warning">Timing is cue-derived and provisional. Native presenter and narrator media do not exist for L09–L12. This silent animatic is internal review evidence, not learner video.</p></main>
<script>
const $=s=>document.querySelector(s), params=new URLSearchParams(location.search);let candidate,timerHandle,countdown=45;
const ids=['L09','L10','L11','L12']; const stateNames=['opening','plate','exercise','closing'];
async function load(){const id=ids.includes(params.get('lesson'))?params.get('lesson'):'L09';$('#lesson').value=id;const response=await fetch(`./${id.toLowerCase()}-request-candidate.json`);if(!response.ok)throw new Error('candidate fetch failed');candidate=await response.json();if(candidate.lesson_id!==id||candidate.execution_allowed||candidate.provider_calls_submitted>0)throw new Error('candidate boundary failed');render(stateNames.includes(params.get('state'))?params.get('state'):'opening')}
function setVisual(content){const visual=$('#visual');visual.replaceChildren();if(content instanceof Node)visual.append(content);else{const box=document.createElement('div');box.className='placeholder';box.textContent=content;visual.append(box)}}
function render(state){clearInterval(timerHandle);const c=candidate;const id=c.lesson_id;const cue=c.timing.cues;const scenes=[...new Set(cue.map(x=>x.scene_id))];let sceneId,caption,body,visual,title;
if(state==='opening'){sceneId=`${id}-01`;title='The decision begins with evidence';body=cue.filter(x=>x.scene_id===sceneId).slice(0,3).map(x=>x.text).join(' ');caption=cue.find(x=>x.scene_id===sceneId).text;visual='Presenter window reserved. No avatar footage or audio generated.'}
else if(state==='plate'){const plate=c.visuals[0];sceneId=plate.scene_id;title='Approved source plate';body=plate.use;caption=cue.find(x=>x.scene_id===sceneId).text;const img=document.createElement('img');img.src=`../../../${plate.path}`;img.alt=plate.text_equivalent;visual=img}
else if(state==='exercise'){sceneId=`${id}-07`;title='Work in your Operating File';body=cue.find(x=>x.speaker==='guided_work_pause').text;caption='Guided work · 45-second visible pause';const number=document.createElement('div');number.className='timer';number.id='countdown';number.setAttribute('aria-label','45 seconds remaining');number.textContent='45';visual=number;countdown=45;timerHandle=setInterval(()=>{countdown=Math.max(0,countdown-1);number.textContent=String(countdown).padStart(2,'0');number.setAttribute('aria-label',`${countdown} seconds remaining`);if(!countdown)clearInterval(timerHandle)},1000)}
else{sceneId=`${id}-08`;title='Operating File draft';body=c.timing.closing_card.audience_copy_exact.join(' ');caption=c.presenter_passages[1].passage_exact;visual=`Provider-free closing card · ${c.timing.closing_card.duration_seconds}s after the final spoken sentence.`}
$('#scene').textContent=`${sceneId} / ${state.toUpperCase()}`;$('#title').textContent=title;$('#body').textContent=body;$('#caption').textContent=caption;setVisual(visual);$('#source').innerHTML=`Source commit <code>${c.source_commit.slice(0,12)}</code> · Candidate <code>${c.candidate_sha256.slice(0,12)}</code> · Provisional run time ${c.timing.proposed_continuous_seconds}s · 45s guided pause · $0 spent`;for(const button of document.querySelectorAll('button[data-state]'))button.setAttribute('aria-pressed',String(button.dataset.state===state));params.set('lesson',id);params.set('state',state);history.replaceState(null,'',`${location.pathname}?${params}`)}
$('#lesson').addEventListener('change',()=>{params.set('lesson',$('#lesson').value);load().catch(fail)});for(const button of document.querySelectorAll('button[data-state]'))button.addEventListener('click',()=>render(button.dataset.state));function fail(error){$('#caption').textContent=`Review load failed: ${error.message}`;throw error}load().catch(fail)
</script></body></html>
