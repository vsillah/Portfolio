<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentified L13–L16 review</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#faf4e6;background:#101922}*{box-sizing:border-box}body{margin:0;padding:16px}.shell{max-width:1200px;margin:auto}.review-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.review-head h1{font-size:20px;margin:0 auto 0 0}.controls{display:flex;gap:7px;flex-wrap:wrap}select,button{font:inherit;background:#243543;color:white;border:1px solid #657782;border-radius:8px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#5a4622;border-color:#f4c96e}button:disabled{opacity:.48;cursor:not-allowed}.stage{aspect-ratio:16/9;min-height:380px;border:1px solid #aa8951;border-radius:16px;background:radial-gradient(circle at 78% 8%,#30475b,#121f2b 68%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:24px;padding:36px;overflow:hidden}.copy{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}.copy h2{font-size:clamp(27px,3.5vw,48px);line-height:1.06;margin:0 0 18px}.copy p{font-size:clamp(18px,1.9vw,24px);line-height:1.35;margin:0 0 10px;overflow-wrap:anywhere}.copy .exercise{font-size:clamp(16px,1.55vw,20px);line-height:1.33}.visual{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #586979;border-radius:12px;background:#182a38;padding:14px;overflow:hidden}.visual img{display:block;min-height:0;max-width:100%;max-height:100%;object-fit:contain}.visual.with-alt img{height:calc(100% - 70px)}.visual .text-equivalent{font-size:14px;line-height:1.3;margin:8px 0 0;color:#f2e5c6;max-width:50ch;text-align:center}.visual .card{font-size:clamp(25px,3vw,39px);font-weight:700;text-align:center;line-height:1.2}.visual .timer{font-size:clamp(96px,13vw,180px);font-variant-numeric:tabular-nums;line-height:1;color:#f5c66c}.caption{background:#080e15;border:1px solid #746b59;border-radius:8px;text-align:center;min-height:58px;padding:12px 16px;margin-top:10px;font-size:18px;line-height:1.35}.meta{font-size:12px;color:#c7d0d5;line-height:1.5}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.capture .review-head,.capture .meta{display:none}.capture{padding:0}.capture .stage{border-radius:0}.capture .caption{border-radius:0;margin-top:0}@media(max-width:700px){body{padding:10px}.review-head h1{font-size:17px}.stage{aspect-ratio:auto;height:calc(100svh - 260px);min-height:560px;max-height:740px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:16px}.copy h2{font-size:29px;margin-bottom:12px}.copy p{font-size:18px;line-height:1.3}.copy .exercise{font-size:15px;line-height:1.25}.visual{padding:8px}.visual.with-alt img{height:calc(100% - 82px)}.visual .text-equivalent{font-size:12px;line-height:1.2}.visual .card{font-size:29px}.caption{font-size:15px;padding:10px;min-height:66px}.capture .stage{height:calc(100svh - 74px);max-height:none;min-height:0}}
</style></head>
<body><main class="shell"><header class="review-head"><h1>Agentified L13–L16 review</h1><nav class="controls" aria-label="Review states"><label>Lesson <select id="lesson"><option>L13</option><option>L14</option><option>L15</option><option>L16</option></select></label><button data-state="opening">Opening</button><button data-state="plate1">Plate 1</button><button data-state="plate2">Plate 2</button><button data-state="exercise">Guided work</button><button data-state="closing">Closing</button></nav></header><section class="stage" aria-label="Audience frame"><div class="copy"><span class="screen-reader" id="scene"></span><h2 id="title"></h2><div id="body"></div></div><div class="visual" id="visual"></div></section><div class="caption" id="caption" aria-live="polite"></div><p class="meta" id="source"></p></main>
<script>
const $=selector=>document.querySelector(selector);const params=new URLSearchParams(location.search);const ids=['L13','L14','L15','L16'];const states=['opening','plate1','plate2','exercise','closing'];let candidate,timerHandle;
if(params.get('capture')==='1')document.body.classList.add('capture');
function showCopy(lines,exercise=false){const box=$('#body');box.replaceChildren();for(const line of lines){const p=document.createElement('p');p.textContent=line;if(exercise)p.className='exercise';box.append(p)}}
function showVisual(content,alt){const box=$('#visual');box.replaceChildren();box.classList.toggle('with-alt',Boolean(alt));if(content instanceof Node)box.append(content);else{const div=document.createElement('div');div.className='card';div.textContent=content;box.append(div)}if(alt){const p=document.createElement('p');p.className='text-equivalent';p.textContent=alt;box.append(p)}}
function render(state){clearInterval(timerHandle);const c=candidate;const cues=c.timing.cues;const scene=state==='opening'?c.scenes[0]:state==='exercise'?c.scenes[6]:state==='closing'?c.scenes[7]:c.scenes.find(item=>item.scene_id===c.visuals[state==='plate2'?1:0].scene_id);if(!scene)throw new Error('Review state unavailable');$('#scene').textContent=scene.scene_id;$('#title').textContent=state==='closing'?'Operating File':c.title;showCopy(state==='exercise'?scene.guided_display_copy_exact:scene.audience_copy_exact,state==='exercise');
if(state==='plate1'||state==='plate2'){const visual=c.visuals[state==='plate2'?1:0];const image=document.createElement('img');image.src=`../../../${visual.path}`;image.alt=visual.text_equivalent;showVisual(image,visual.text_equivalent)}else if(state==='exercise'){const timer=document.createElement('div');timer.className='timer';timer.id='countdown';timer.textContent='45';timer.setAttribute('role','timer');timer.setAttribute('aria-label','45 seconds remaining');showVisual(timer);let remaining=45;timerHandle=setInterval(()=>{remaining=Math.max(0,remaining-1);timer.textContent=String(remaining).padStart(2,'0');timer.setAttribute('aria-label',`${remaining} seconds remaining`);if(!remaining)clearInterval(timerHandle)},1000)}else if(state==='opening'){const image=document.createElement('img');image.src=`../../../${c.cover.path}`;image.alt=`${c.title} lesson cover`;showVisual(image)}else{showVisual(scene.audience_copy_exact.join(' '))}
const sceneCues=cues.filter(item=>item.scene_id===scene.scene_id&&item.speaker!=='guided_work_pause');$('#caption').textContent=state==='closing'?c.presenter_passages[1].passage_exact:sceneCues[0].text.trim();$('#source').textContent=`Internal review: ${c.source_commit.slice(0,12)} · ${c.candidate_sha256.slice(0,12)} · provisional ${c.timing.proposed_continuous_seconds}s · no provider audio`;for(const button of document.querySelectorAll('button[data-state]'))button.setAttribute('aria-pressed',String(button.dataset.state===state));params.set('lesson',c.lesson_id);params.set('state',state);history.replaceState(null,'',`${location.pathname}?${params}`)}
async function load(){const id=ids.includes(params.get('lesson'))?params.get('lesson'):'L13';$('#lesson').value=id;const response=await fetch(`./${id.toLowerCase()}-request-candidate.json`);if(!response.ok)throw new Error('Candidate unavailable');candidate=await response.json();if(candidate.lesson_id!==id||candidate.execution_allowed||candidate.provider_jobs_submitted!==0)throw new Error('Review boundary failed');const second=$('button[data-state="plate2"]');second.disabled=candidate.visuals.length<2;second.title=second.disabled?'One approved plate in this lesson':'Show the second approved plate';let state=states.includes(params.get('state'))?params.get('state'):'opening';if(state==='plate2'&&second.disabled)state='plate1';render(state)}
$('#lesson').addEventListener('change',()=>{params.set('lesson',$('#lesson').value);load().catch(fail)});for(const button of document.querySelectorAll('button[data-state]'))button.addEventListener('click',()=>render(button.dataset.state));function fail(error){$('#caption').textContent=`Review load failed: ${error.message}`;throw error}load().catch(fail)
</script></body></html>
