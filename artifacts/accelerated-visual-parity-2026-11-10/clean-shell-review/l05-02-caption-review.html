<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L05 clean card caption review</title>
<style>
  body { margin: 0; background: #0b2029; color: #eee6d8; font: 16px system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { line-height: 1.4; margin: 0 0 18px; }
  section { margin: 18px 0 26px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  video { display: block; width: 100%; height: auto; background: #000; }
</style>
<main>
  <h1>L05-02 clean card · review only</h1>
  <p>Both clips show the same source caption at eight seconds of the 112–124s excerpt. The cleaned clip shows the scripted F01/F02 beat and removes pending-source rows. F03/F04 has a separate review frame for its later cue.</p>
  <button type="button" id="cue">Jump both clips to 8s</button>
  <section><h2>Current visual</h2><video controls playsinline preload="auto" data-review-time="8">
    <source src="l05-02-before-12s.mp4" type="video/mp4">
    <track default kind="captions" srclang="en" label="English" src="l05-02-caption-excerpt.vtt">
  </video></section>
  <section><h2>Clean card candidate</h2><video controls playsinline preload="auto" data-review-time="8">
    <source src="l05-02-clean-12s.mp4" type="video/mp4">
    <track default kind="captions" srclang="en" label="English" src="l05-02-caption-excerpt.vtt">
  </video></section>
</main>
<script>
  document.querySelector('#cue').addEventListener('click', () => {
    for (const video of document.querySelectorAll('video')) { video.currentTime = 8; video.pause(); }
  });
  for (const video of document.querySelectorAll('video')) {
    if (video.textTracks[0]) video.textTracks[0].mode = 'showing';
  }
</script>
</html>
