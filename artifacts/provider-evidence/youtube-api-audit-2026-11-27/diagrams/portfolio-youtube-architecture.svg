<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio YouTube workflow review-only architecture</title>
  <desc id="desc">Architecture diagram showing Portfolio review, evidence, Human QA, the YouTube adapter, and fail-closed external execution controls.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4da3ff"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2dd4bf"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff6b6b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.22"/></filter>
    <style>
      .title{font:700 36px Inter,Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 18px Inter,Arial,sans-serif;fill:#94a3b8}
      .h{font:700 20px Inter,Arial,sans-serif;fill:#f8fafc}.b{font:400 17px Inter,Arial,sans-serif;fill:#dbeafe}.small{font:600 15px Inter,Arial,sans-serif;fill:#cbd5e1}
      .box{stroke-width:2;rx:18;filter:url(#shadow)}.arrow{fill:none;stroke-width:3;marker-end:url(#arrow-blue)}.data{fill:none;stroke:#2dd4bf;stroke-width:3;marker-end:url(#arrow-cyan)}
      .locked{fill:none;stroke:#ff6b6b;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#071421"/>
  <circle cx="1390" cy="120" r="260" fill="#0b2b44" opacity="0.55"/><circle cx="140" cy="760" r="300" fill="#10213d" opacity="0.45"/>
  <text x="80" y="70" class="title">Portfolio YouTube Workflow</text>
  <text x="80" y="105" class="subtitle">Review-only architecture • synthetic or approved data • external execution locked</text>

  <rect x="70" y="180" width="220" height="120" class="box" fill="#0f3b61" stroke="#4da3ff"/>
  <text x="180" y="225" text-anchor="middle" class="h">Authorized operator</text><text x="180" y="258" text-anchor="middle" class="b">Portfolio admin</text>
  <rect x="370" y="155" width="260" height="170" class="box" fill="#0f3b61" stroke="#4da3ff"/>
  <text x="500" y="205" text-anchor="middle" class="h">Review surface</text><text x="500" y="242" text-anchor="middle" class="b">Copy • title • description</text><text x="500" y="272" text-anchor="middle" class="b">thumbnail • evidence</text><text x="500" y="302" text-anchor="middle" class="small">version-bound candidate</text>
  <polygon points="785,155 885,240 785,325 685,240" fill="#5b3218" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="225" text-anchor="middle" class="h">Human QA</text><text x="785" y="253" text-anchor="middle" class="b">and submission</text><text x="785" y="280" text-anchor="middle" class="b">authority?</text>
  <rect x="945" y="155" width="250" height="170" class="box" fill="#3b1f50" stroke="#c084fc"/>
  <text x="1070" y="205" text-anchor="middle" class="h">YouTube adapter</text><text x="1070" y="242" text-anchor="middle" class="b">OAuth-bound client</text><text x="1070" y="272" text-anchor="middle" class="b">metadata + upload paths</text><text x="1070" y="302" text-anchor="middle" class="small">separate execution gate</text>
  <rect x="1280" y="180" width="245" height="120" class="box" fill="#3b1f50" stroke="#c084fc"/>
  <text x="1402" y="225" text-anchor="middle" class="h">YouTube API Services</text><text x="1402" y="258" text-anchor="middle" class="b">provider boundary</text>

  <rect x="370" y="430" width="260" height="145" class="box" fill="#0b3c43" stroke="#2dd4bf"/>
  <text x="500" y="475" text-anchor="middle" class="h">Portfolio records</text><text x="500" y="510" text-anchor="middle" class="b">content • approvals</text><text x="500" y="540" text-anchor="middle" class="b">receipts • status</text>
  <rect x="705" y="430" width="260" height="145" class="box" fill="#0b3c43" stroke="#2dd4bf"/>
  <text x="835" y="475" text-anchor="middle" class="h">Evidence layer</text><text x="835" y="510" text-anchor="middle" class="b">hashes • provenance</text><text x="835" y="540" text-anchor="middle" class="b">privacy • rights</text>
  <rect x="1040" y="430" width="260" height="145" class="box" fill="#0b3c43" stroke="#2dd4bf"/>
  <text x="1170" y="475" text-anchor="middle" class="h">Public observations</text><text x="1170" y="510" text-anchor="middle" class="b">IDs • timestamps • status</text><text x="1170" y="540" text-anchor="middle" class="b">audience + engagement counts</text>

  <path d="M290 240 H365" class="arrow"/><path d="M630 240 H680" class="arrow"/>
  <path d="M500 325 V425" class="data"/><path d="M630 503 H700" class="data"/><path d="M1040 503 H970" class="data"/><path d="M1070 325 V425" class="data"/>
  <path d="M890 240 H940" class="locked"/><path d="M1195 240 H1275" class="locked"/>
  <text x="915" y="221" text-anchor="middle" class="small">separate authority</text><text x="1236" y="221" text-anchor="middle" class="small">upload / publish</text>

  <rect x="450" y="670" width="700" height="135" rx="18" fill="#481f29" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="712" text-anchor="middle" class="h">Fail-closed controls in this review</text>
  <text x="800" y="750" text-anchor="middle" class="b">No derived scoring • no collection activation • no persistence or evidence linkage</text>
  <text x="800" y="782" text-anchor="middle" class="b">No upload, scheduling, publishing, outreach, provider configuration, or production write</text>
  <path d="M835 575 V665" class="locked"/><path d="M1170 575 C1170 635 1135 640 1080 665" class="locked"/>
  <text x="80" y="858" class="subtitle">Solid arrows: existing internal/read-only flow. Dashed red arrows: separately authorized provider execution, excluded from this recording.</text>
</svg>
