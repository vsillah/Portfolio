<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">KickLab Fight Race and Kick product evidence dashboard</title>
  <desc id="desc">A polished dark product dashboard showing momentum, grip, and vector experiments across KickLab's three game modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10264a"/>
      <stop offset="1" stop-color="#29184d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c74b"/>
      <stop offset="1" stop-color="#ff8b3d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe7ff"/>
      <stop offset="1" stop-color="#6b8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="1070" cy="84" r="180" fill="#7937d8" opacity=".12"/>
  <circle cx="120" cy="820" r="230" fill="#23cce2" opacity=".08"/>

  <g transform="translate(64 54)">
    <rect width="1072" height="792" rx="34" fill="#07111f" fill-opacity=".8" stroke="#8eb8ec" stroke-opacity=".24"/>
    <g transform="translate(44 36)">
      <rect width="62" height="62" rx="18" fill="url(#gold)"/>
      <path d="M17 43 29 18h7l12 25h-8l-2.5-6H27L24.5 43Zm13-13h5l-2.5-6Z" fill="#07111f"/>
      <text x="82" y="28" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">KICKLAB</text>
      <text x="82" y="52" fill="#a8bdd8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">PLAY THE PHYSICS</text>
      <rect x="760" y="3" width="223" height="48" rx="24" fill="#102b46" stroke="#5fe7ff" stroke-opacity=".45"/>
      <circle cx="790" cy="27" r="7" fill="#55e38d"/>
      <text x="809" y="33" fill="#d9f8ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Experiment ready</text>
    </g>

    <g transform="translate(44 132)" filter="url(#shadow)">
      <rect width="984" height="146" rx="26" fill="#0f2038" stroke="#f6c74b" stroke-opacity=".34"/>
      <text x="28" y="38" fill="#f6c74b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2">THE PLAYER CHOOSES</text>
      <text x="28" y="77" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Change the input. Watch the result move.</text>
      <text x="28" y="110" fill="#9db1cc" font-family="Arial, Helvetica, sans-serif" font-size="17">Every mode turns a game decision into a visible physics relationship.</text>
      <path d="M745 75h135" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/>
      <path d="m868 55 30 20-30 20" fill="none" stroke="#5fe7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="724" cy="75" r="17" fill="#ff8b3d"/>
      <circle cx="914" cy="75" r="17" fill="#6b8cff"/>
    </g>

    <g transform="translate(44 306)">
      <g>
        <rect width="306" height="386" rx="28" fill="#0d1d32" stroke="#ff9e4a" stroke-opacity=".5"/>
        <rect x="22" y="22" width="86" height="34" rx="17" fill="#40251b"/>
        <text x="65" y="45" text-anchor="middle" fill="#ffb26b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">FIGHT</text>
        <text x="22" y="98" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Momentum</text>
        <text x="22" y="126" fill="#94aac6" font-family="Arial, Helvetica, sans-serif" font-size="15">Mass × speed changes impact.</text>
        <circle cx="94" cy="212" r="42" fill="#ff8b3d"/>
        <circle cx="235" cy="212" r="30" fill="#6b8cff"/>
        <path d="M142 212h50" stroke="#f6c74b" stroke-width="10" stroke-linecap="round"/>
        <path d="m181 194 27 18-27 18" fill="none" stroke="#f6c74b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="22" y="291" width="262" height="68" rx="16" fill="#132b47"/>
        <text x="38" y="319" fill="#9db1cc" font-family="Arial, Helvetica, sans-serif" font-size="13">VISIBLE RESULT</text>
        <text x="38" y="344" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Higher impulse → 2.4× push</text>
      </g>

      <g transform="translate(339)">
        <rect width="306" height="386" rx="28" fill="#0d1d32" stroke="#5fe7ff" stroke-opacity=".5"/>
        <rect x="22" y="22" width="86" height="34" rx="17" fill="#123745"/>
        <text x="65" y="45" text-anchor="middle" fill="#72eaff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">RACE</text>
        <text x="22" y="98" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Grip</text>
        <text x="22" y="126" fill="#94aac6" font-family="Arial, Helvetica, sans-serif" font-size="15">Traction changes the fastest line.</text>
        <path d="M42 245c64-126 146 82 224-62" fill="none" stroke="#29415f" stroke-width="34" stroke-linecap="round"/>
        <path d="M42 245c64-126 146 82 224-62" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 10"/>
        <circle cx="166" cy="194" r="19" fill="#f6c74b" stroke="#ffffff" stroke-width="4"/>
        <rect x="22" y="291" width="262" height="68" rx="16" fill="#132b47"/>
        <text x="38" y="319" fill="#9db1cc" font-family="Arial, Helvetica, sans-serif" font-size="13">VISIBLE RESULT</text>
        <text x="38" y="344" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">More grip → tighter corner</text>
      </g>

      <g transform="translate(678)">
        <rect width="306" height="386" rx="28" fill="#0d1d32" stroke="#aa7dff" stroke-opacity=".55"/>
        <rect x="22" y="22" width="86" height="34" rx="17" fill="#2c2248"/>
        <text x="65" y="45" text-anchor="middle" fill="#c6a8ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">KICK</text>
        <text x="22" y="98" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Vectors</text>
        <text x="22" y="126" fill="#94aac6" font-family="Arial, Helvetica, sans-serif" font-size="15">Angle and force shape the flight.</text>
        <path d="M50 250Q150 122 257 205" fill="none" stroke="#aa7dff" stroke-width="8" stroke-linecap="round"/>
        <path d="m237 187 28 17-29 15" fill="none" stroke="#aa7dff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="250" r="21" fill="#f6c74b" stroke="#ffffff" stroke-width="4"/>
        <path d="M50 250v-72" stroke="#5fe7ff" stroke-width="6" stroke-linecap="round"/>
        <path d="M50 250h86" stroke="#ff8b3d" stroke-width="6" stroke-linecap="round"/>
        <rect x="22" y="291" width="262" height="68" rx="16" fill="#132b47"/>
        <text x="38" y="319" fill="#9db1cc" font-family="Arial, Helvetica, sans-serif" font-size="13">VISIBLE RESULT</text>
        <text x="38" y="344" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">42° launch → top corner</text>
      </g>
    </g>

    <g transform="translate(44 722)">
      <text x="0" y="24" fill="#9db1cc" font-family="Arial, Helvetica, sans-serif" font-size="14">Choice</text>
      <path d="M62 18h90" stroke="#38506d" stroke-width="3"/>
      <text x="169" y="24" fill="#9db1cc" font-family="Arial, Helvetica, sans-serif" font-size="14">Result</text>
      <path d="M228 18h90" stroke="#38506d" stroke-width="3"/>
      <text x="335" y="24" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Explanation you can test again</text>
      <text x="984" y="24" text-anchor="end" fill="#f6c74b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">FIGHT · RACE · KICK</text>
    </g>
  </g>
</svg>
