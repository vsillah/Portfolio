<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">KickLab Feel the Math YouTube thumbnail</title>
  <desc id="desc">A premium dark YouTube thumbnail where an orange impact sphere, cyan motion vector, product result, and staggered gold display lettering form one energetic composition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04101f"/>
      <stop offset=".58" stop-color="#102a4e"/>
      <stop offset="1" stop-color="#351958"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4a8"/>
      <stop offset=".45" stop-color="#f8c548"/>
      <stop offset="1" stop-color="#ff7438"/>
    </linearGradient>
    <linearGradient id="vector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61efff"/>
      <stop offset="1" stop-color="#7786ff"/>
    </linearGradient>
    <radialGradient id="impact" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff7c0"/>
      <stop offset=".28" stop-color="#ffb53f"/>
      <stop offset=".72" stop-color="#ff683c"/>
      <stop offset="1" stop-color="#8d214c"/>
    </radialGradient>
    <filter id="deep-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#020610" flood-opacity=".85"/>
    </filter>
    <filter id="gold-glow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="3" flood-color="#020610" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ffb43f" flood-opacity=".42"/>
    </filter>
    <filter id="cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="72" y="102" width="600" height="470" rx="34"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <path d="M0 560C310 430 470 665 772 475 960 357 1040 278 1200 310V675H0Z" fill="#030a16" opacity=".58"/>
  <circle cx="1110" cy="80" r="230" fill="#7d3bda" opacity=".13"/>
  <path d="M34 86C286 12 508 18 774 102" fill="none" stroke="#63e9ff" stroke-width="2" opacity=".25"/>

  <g filter="url(#deep-shadow)">
    <rect x="52" y="82" width="640" height="510" rx="42" fill="#071323" stroke="#79ddec" stroke-width="4" stroke-opacity=".38"/>
    <rect x="72" y="102" width="600" height="470" rx="34" fill="#0b1d34"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="72" y="102" width="600" height="470" fill="#0b1d34"/>
    <path d="M72 425C230 264 376 507 672 238V572H72Z" fill="#142e4d"/>
    <path d="M100 453C250 300 395 507 636 278" fill="none" stroke="#284968" stroke-width="42" stroke-linecap="round"/>
    <path d="M100 453C250 300 395 507 636 278" fill="none" stroke="url(#vector)" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 15"/>
    <circle cx="248" cy="362" r="104" fill="none" stroke="#ff9d45" stroke-width="5" opacity=".35"/>
    <circle cx="248" cy="362" r="72" fill="url(#impact)" stroke="#fff0aa" stroke-width="8"/>
    <path d="M320 362h150" stroke="url(#vector)" stroke-width="17" stroke-linecap="round" filter="url(#cyan-glow)"/>
    <path d="m444 330 52 32-52 32" fill="none" stroke="#7aefff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(98 130)">
      <rect width="180" height="52" rx="26" fill="#0c3142" stroke="#65e9ff" stroke-opacity=".65"/>
      <circle cx="28" cy="26" r="8" fill="#56e08b"/>
      <text x="49" y="33" fill="#dffbff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1">FIGHT MODE</text>
    </g>
    <g transform="translate(390 444)">
      <rect width="246" height="90" rx="20" fill="#07111f" stroke="#f5c54b" stroke-opacity=".55"/>
      <text x="22" y="31" fill="#93abc7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">VISIBLE RESULT</text>
      <text x="22" y="67" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900">2.4× MORE PUSH</text>
    </g>
  </g>

  <g transform="translate(705 88)">
    <path d="M-24 184C120 86 246 120 444 20" fill="none" stroke="#ffb641" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <circle cx="415" cy="34" r="15" fill="#ff7a3c"/>
    <g transform="rotate(-7 210 232)" filter="url(#gold-glow)" font-family="Arial Black, Impact, sans-serif" font-weight="950" text-anchor="middle" style="paint-order:stroke fill">
      <text x="205" y="128" fill="#ffffff" stroke="#07111f" stroke-width="8" font-size="66" letter-spacing="12">FEEL</text>
      <text x="210" y="258" fill="url(#display)" stroke="#07111f" stroke-width="13" font-size="145" letter-spacing="-7">THE</text>
      <text x="222" y="407" fill="url(#display)" stroke="#07111f" stroke-width="15" font-size="159" letter-spacing="-9">MATH</text>
    </g>
    <path d="M16 432h398" stroke="#63eaff" stroke-width="5" stroke-linecap="round" opacity=".76"/>
    <path d="m385 414 31 18-31 18" fill="none" stroke="#63eaff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="486" text-anchor="middle" fill="#c7d8eb" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">CHOICE → FORCE → RESULT</text>
  </g>

  <g transform="translate(58 31)">
    <rect width="54" height="36" rx="11" fill="url(#display)"/>
    <text x="27" y="26" text-anchor="middle" fill="#07111f" font-family="Arial Black, Impact, sans-serif" font-size="21" font-weight="900">KL</text>
    <text x="68" y="26" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="2">KICKLAB</text>
  </g>
</svg>
