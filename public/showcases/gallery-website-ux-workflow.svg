<rect width="1200" height="720" fill="url(#bg)"/><circle cx="1065" cy="65" r="260" fill="#b8abed" opacity=".06"/>
<rect x="42" y="42" width="1116" height="636" rx="30" fill="none" stroke="#71839b" stroke-opacity=".4"/>
<text x="78" y="107" fill="#b8abed" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">WORKFLOW</text><text x="78" y="164" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="45" font-weight="700" letter-spacing="0">Make the next step obvious</text>
<text x="78" y="206" fill="#b8c4d6" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0">A focused page review and revision path</text>
