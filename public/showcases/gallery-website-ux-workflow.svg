<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Make the next step obvious</title><desc id="desc">A focused page review and revision path. Illustrative concept, not a product screenshot.</desc>
