="Inter,Arial,sans-serif" font-size="26" font-weight="500" letter-spacing="0">new path</text><text x="903" y="481" fill="#bdd8d2" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="0">Mobile first</text>
