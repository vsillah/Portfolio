<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A question gets a clear handoff</title><desc id="desc">From first message to a reviewed lead. Illustrative concept, not a product screenshot.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2e"/><stop offset="1" stop-color="#263957"/></linearGradient></defs>
<rect width="1200" height="720" fill="url(#bg)"/><circle cx="1065" cy="65" r="260" fill="#70b8c6" opacity=".06"/>
<rect x="42" y="42" width="1116" height="636" rx="30" fill="none" stroke="#71839b" stroke-opacity=".4"/>
<text x="78" y="107" fill="#70b8c6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">WORKFLOW</text><text x="78" y="164" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="45" font-weight="700" letter-spacing="0">A question gets a clear handoff</text>
<text x="78" y="206" fill="#b8c4d6" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0">From first message to a reviewed lead</text>
<rect x="78" y="262" width="320" height="300" rx="22" fill="#1b2d48" stroke="#465979" stroke-width="2"/><text x="104" y="308" fill="#d4af37" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="0">01 / INQUIRY</text><text x="104" y="366" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="500" letter-spacing="0">What do you need?</text><rect x="103" y="397" width="267" height="105" rx="15" fill="#263d5a" stroke="#6684a3" stroke-width="2"/><text x="125" y="439" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" letter-spacing="0">A visitor asks</text><text x="125" y="472" fill="#c4d2df" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" letter-spacing="0">for a next step</text><path d="M419 412L501 412" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/><rect x="515" y="262" width="290" height="300" rx="22" fill="#1b2d48" stroke="#465979" stroke-width="2"/><text x="541" y="308" fill="#d4af37" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="0">02 / REVIEW</text><text x="541" y="369" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="0">Route the request</text><text x="541" y="420" fill="#bdd1dd" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" letter-spacing="0">Need</text><text x="541" y="454" fill="#bdd1dd" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" letter-spacing="0">Consent</text><text x="541" y="488" fill="#bdd1dd" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" letter-spacing="0">Owner</text><path d="M824 412L878 412" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/><rect x="893" y="262" width="229" height="300" rx="22" fill="#1b2d48" stroke="#465979" stroke-width="2"/><text x="918" y="308" fill="#d4af37" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="0">03 / HANDOFF</text><text x="918" y="374" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="500" letter-spacing="0">Human</text><text x="918" y="411" fill="#f5f3f0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="500" letter-spacing="0">follow-up</text><text x="918" y="481" fill="#b9c8d8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="0">No silent send</text>
<path d="M78 628L1122 628" fill="none" stroke="#71839b" stroke-width="3" stroke-linecap="round"/>
<text x="78" y="658" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ILLUSTRATIVE CONCEPT · NOT A PRODUCT SCREENSHOT</text>
<text x="1118" text-anchor="end" y="658" fill="#70b8c6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">AMADUTOWN</text>
</svg>