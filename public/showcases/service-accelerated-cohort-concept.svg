<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Illustrative concept for Accelerated cohort">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2b"/><stop offset="1" stop-color="#233247"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/>
<rect x="36" y="30" width="1128" height="660" rx="28" fill="#142339" stroke="#496177" stroke-width="1"/>
<rect x="64" y="58" width="12" height="12" rx="6" fill="#e8bd62" stroke="none" stroke-width="1"/>
<text x="88" y="70" fill="#b9cbd9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start">SERVICE CONCEPT</text>
<text x="64" y="150" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" text-anchor="start">Accelerated cohort</text>
<text x="64" y="194" fill="#b9cbd9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" text-anchor="start">A workshop moves from problem to build</text>
<line x1="64" y1="222" x2="1136" y2="222" stroke="#42556b" stroke-width="2"/>
<rect x="98" y="263" width="1004" height="313" rx="18" fill="#f5f0e6" stroke="none" stroke-width="1"/><text x="138" y="309" fill="#8b6b3a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">COHORT WORKSPACE</text><rect x="138" y="343" width="274" height="174" rx="15" fill="#fff" stroke="#d9c9ac" stroke-width="1"/><rect x="463" y="343" width="274" height="174" rx="15" fill="#fff" stroke="#d9c9ac" stroke-width="1"/><rect x="788" y="343" width="274" height="174" rx="15" fill="#fff" stroke="#d9c9ac" stroke-width="1"/><text x="163" y="382" fill="#243447" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">01  Find the problem</text><text x="163" y="425" fill="#586777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">Name the work people</text><text x="163" y="452" fill="#586777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">need done.</text><text x="488" y="382" fill="#243447" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">02  Make a plan</text><text x="488" y="425" fill="#586777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">Map decisions, data,</text><text x="488" y="452" fill="#586777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">and handoffs.</text><text x="813" y="382" fill="#243447" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">03  Build and test</text><text x="813" y="425" fill="#586777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">Leave with a working</text><text x="813" y="452" fill="#586777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start">next step.</text>
<line x1="64" y1="632" x2="1136" y2="632" stroke="#42556b" stroke-width="1"/>
<text x="64" y="665" fill="#e8bd62" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start">ILLUSTRATIVE CONCEPT · NOT A PRODUCT SCREENSHOT</text>
<text x="1136" y="665" fill="#96a8ba" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="end">AmaduTown showcase preview</text>
