<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Learning Plan Framework</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">What a Learning Plan Actually Is</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">Think of it as a decision rehearsal—you're planning</text><text x="80" y="255" font-family="Georgia,serif" font-size="32" fill="#22303a">your next moves before you know the results.</text><text x="80" y="335" font-family="Georgia,serif" font-size="32" fill="#22303a">It's not a template you fill out to satisfy the</text><text x="80" y="375" font-family="Georgia,serif" font-size="32" fill="#22303a">process. It's a thinking tool that forces clarity</text><text x="80" y="415" font-family="Georgia,serif" font-size="32" fill="#22303a">about:</text><text x="80" y="495" font-family="Georgia,serif" font-size="32" fill="#22303a">● What we believe will happen (hypothesis)</text><text x="80" y="575" font-family="Georgia,serif" font-size="32" fill="#22303a">● How we'll know if we're right (metrics)</text><text x="80" y="655" font-family="Georgia,serif" font-size="32" fill="#22303a">● What we'll do if we're wrong (pivot options)</text><text x="80" y="735" font-family="Georgia,serif" font-size="32" fill="#22303a">● What we'll learn either way (capture mechanism)</text><text x="80" y="815" font-family="Georgia,serif" font-size="32" fill="#22303a">When done right, a Learning Plan turns every</text><text x="80" y="855" font-family="Georgia,serif" font-size="32" fill="#22303a">experiment into an institutional asset, not just a</text><text x="80" y="895" font-family="Georgia,serif" font-size="32" fill="#22303a">one-time test.</text></svg>
