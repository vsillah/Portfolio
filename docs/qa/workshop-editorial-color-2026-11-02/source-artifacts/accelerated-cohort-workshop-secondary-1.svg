<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Learning Roadmap</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">Anchor Roadmaps in Customer Outcomes</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">Most roadmaps start with features.</text><text x="80" y="295" font-family="Georgia,serif" font-size="32" fill="#22303a">Great ones start with jobs-to-be-done and customer</text><text x="80" y="335" font-family="Georgia,serif" font-size="32" fill="#22303a">outcomes.</text><text x="80" y="415" font-family="Georgia,serif" font-size="32" fill="#22303a">This is where Outcome-Driven Innovation (Ulwick)</text><text x="80" y="455" font-family="Georgia,serif" font-size="32" fill="#22303a">becomes your north star.</text><text x="80" y="535" font-family="Georgia,serif" font-size="32" fill="#22303a">Instead of:</text><text x="80" y="615" font-family="Georgia,serif" font-size="32" fill="#22303a">Q3 Roadmap:</text><text x="80" y="695" font-family="Georgia,serif" font-size="32" fill="#22303a">● Rebuild notification system</text></svg>
