<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">The Full Discovery Loop</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">● Archive → Learnings go into institutional memory</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">Every feedback becomes a data point. Every pattern</text><text x="80" y="255" font-family="Georgia,serif" font-size="32" fill="#22303a">becomes a testable hypothesis. Every hypothesis</text><text x="80" y="295" font-family="Georgia,serif" font-size="32" fill="#22303a">becomes organizational knowledge.</text><text x="80" y="375" font-family="Georgia,serif" font-size="32" fill="#22303a">Focus the Problem Space</text></svg>
