<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Learning Roadmap</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="20" fill="#22303a">Anchor Roadmaps in Customer Outcomes</text><text x="80" y="185" font-family="Georgia,serif" font-size="20" fill="#22303a">Most roadmaps start with features.</text><text x="80" y="235" font-family="Georgia,serif" font-size="20" fill="#22303a">Great ones start with jobs-to-be-done and customer</text><text x="80" y="260" font-family="Georgia,serif" font-size="20" fill="#22303a">outcomes.</text><text x="80" y="310" font-family="Georgia,serif" font-size="20" fill="#22303a">This is where Outcome-Driven Innovation (Ulwick)</text><text x="80" y="335" font-family="Georgia,serif" font-size="20" fill="#22303a">becomes your north star.</text><text x="80" y="385" font-family="Georgia,serif" font-size="20" fill="#22303a">Instead of:</text><text x="80" y="435" font-family="Georgia,serif" font-size="20" fill="#22303a">Q3 Roadmap:</text><text x="80" y="485" font-family="Georgia,serif" font-size="20" fill="#22303a">● Rebuild notification system</text><text x="80" y="535" font-family="Georgia,serif" font-size="20" fill="#22303a">● Add team collaboration features</text><text x="80" y="585" font-family="Georgia,serif" font-size="20" fill="#22303a">● Improve dashboard performance</text><text x="80" y="635" font-family="Georgia,serif" font-size="20" fill="#22303a">Try:</text><text x="80" y="685" font-family="Georgia,serif" font-size="20" fill="#22303a">Q3 Learning Goals:</text><text x="80" y="735" font-family="Georgia,serif" font-size="20" fill="#22303a">● Reduce overwhelm: Help users filter signal from</text><text x="80" y="760" font-family="Georgia,serif" font-size="20" fill="#22303a">noise (Target: 40% reduction in &quot;mute all</text><text x="80" y="785" font-family="Georgia,serif" font-size="20" fill="#22303a">notifications&quot; actions)</text><text x="80" y="835" font-family="Georgia,serif" font-size="20" fill="#22303a">● Enable coordination: Let teams work together</text><text x="80" y="860" font-family="Georgia,serif" font-size="20" fill="#22303a">without friction (Target: 30% increase in</text><text x="80" y="885" font-family="Georgia,serif" font-size="20" fill="#22303a">multi-person file edits)</text><text x="80" y="935" font-family="Georgia,serif" font-size="20" fill="#22303a">● Increase confidence: Give users trust in real-time</text><text x="80" y="960" font-family="Georgia,serif" font-size="20" fill="#22303a">data (Target: Dashboard refresh rate &lt;5 seconds)</text><text x="80" y="1010" font-family="Georgia,serif" font-size="20" fill="#22303a">Now your roadmap isn't a timeline of tech debt and</text><text x="80" y="1035" font-family="Georgia,serif" font-size="20" fill="#22303a">business asks—it's a story of progress toward real</text><text x="80" y="1060" font-family="Georgia,serif" font-size="20" fill="#22303a">impact.</text></svg>
