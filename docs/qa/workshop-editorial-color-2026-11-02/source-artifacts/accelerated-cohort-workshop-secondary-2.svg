<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Learning Roadmap</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">● Add team collaboration features</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">● Improve dashboard performance</text><text x="80" y="295" font-family="Georgia,serif" font-size="32" fill="#22303a">Try:</text><text x="80" y="375" font-family="Georgia,serif" font-size="32" fill="#22303a">Q3 Learning Goals:</text><text x="80" y="455" font-family="Georgia,serif" font-size="32" fill="#22303a">● Reduce overwhelm: Help users filter signal from</text><text x="80" y="495" font-family="Georgia,serif" font-size="32" fill="#22303a">noise (Target: 40% reduction in &quot;mute all</text><text x="80" y="535" font-family="Georgia,serif" font-size="32" fill="#22303a">notifications&quot; actions)</text><text x="80" y="615" font-family="Georgia,serif" font-size="32" fill="#22303a">● Enable coordination: Let teams work together</text><text x="80" y="655" font-family="Georgia,serif" font-size="32" fill="#22303a">without friction (Target: 30% increase in</text><text x="80" y="695" font-family="Georgia,serif" font-size="32" fill="#22303a">multi-person file edits)</text><text x="80" y="775" font-family="Georgia,serif" font-size="32" fill="#22303a">● Increase confidence: Give users trust in real-time</text><text x="80" y="815" font-family="Georgia,serif" font-size="32" fill="#22303a">data (Target: Dashboard refresh rate &lt;5 seconds)</text><text x="80" y="895" font-family="Georgia,serif" font-size="32" fill="#22303a">Now your roadmap isn't a timeline of tech debt and</text><text x="80" y="935" font-family="Georgia,serif" font-size="32" fill="#22303a">business asks—it's a story of progress toward real</text><text x="80" y="975" font-family="Georgia,serif" font-size="32" fill="#22303a">impact.</text></svg>
