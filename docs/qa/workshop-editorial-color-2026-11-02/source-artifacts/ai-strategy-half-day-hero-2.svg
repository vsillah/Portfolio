<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">The Full Discovery Loop</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">● Synthesize → ClientQ translates to JTBD statements</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">● Prioritize → We score by importance + satisfaction</text><text x="80" y="255" font-family="Georgia,serif" font-size="32" fill="#22303a">gap</text><text x="80" y="335" font-family="Georgia,serif" font-size="32" fill="#22303a">● Validate → We test hypotheses with small</text><text x="80" y="375" font-family="Georgia,serif" font-size="32" fill="#22303a">experiments</text></svg>
