<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">ClientQ: Jobs from Noise</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="20" fill="#22303a">What ClientQ Actually Does</text><text x="80" y="185" font-family="Georgia,serif" font-size="20" fill="#22303a">Whether you feed it one quote or a spreadsheet full</text><text x="80" y="210" font-family="Georgia,serif" font-size="20" fill="#22303a">of comments, ClientQ:</text><text x="80" y="260" font-family="Georgia,serif" font-size="20" fill="#22303a">1. Ingests raw feedback</text><text x="80" y="310" font-family="Georgia,serif" font-size="20" fill="#22303a">Surveys, transcripts, tickets, NPS comments—anything</text><text x="80" y="335" font-family="Georgia,serif" font-size="20" fill="#22303a">textual</text><text x="80" y="385" font-family="Georgia,serif" font-size="20" fill="#22303a">2. Extracts job steps and desired outcomes</text><text x="80" y="435" font-family="Georgia,serif" font-size="20" fill="#22303a">Translates &quot;this is confusing&quot; into &quot;minimize time</text><text x="80" y="460" font-family="Georgia,serif" font-size="20" fill="#22303a">spent understanding how to X&quot;</text><text x="80" y="510" font-family="Georgia,serif" font-size="20" fill="#22303a">3. Sorts outcomes by type</text><text x="80" y="560" font-family="Georgia,serif" font-size="20" fill="#22303a">● Minimize (reduce time, effort, risk)</text><text x="80" y="610" font-family="Georgia,serif" font-size="20" fill="#22303a">● Increase (improve quality, confidence, speed)</text><text x="80" y="660" font-family="Georgia,serif" font-size="20" fill="#22303a">● Enable (make something possible)</text><text x="80" y="710" font-family="Georgia,serif" font-size="20" fill="#22303a">● Reduce (lower cost, complexity, anxiety)</text><text x="80" y="760" font-family="Georgia,serif" font-size="20" fill="#22303a">4. Optionally scores by importance and satisfaction</text><text x="80" y="810" font-family="Georgia,serif" font-size="20" fill="#22303a">If you provide data, it can prioritize the biggest</text><text x="80" y="835" font-family="Georgia,serif" font-size="20" fill="#22303a">gaps</text><text x="80" y="885" font-family="Georgia,serif" font-size="20" fill="#22303a">5. Outputs structured JTBD statements</text><text x="80" y="935" font-family="Georgia,serif" font-size="20" fill="#22303a">Ready for your hypothesis backlog, roadmap</text><text x="80" y="960" font-family="Georgia,serif" font-size="20" fill="#22303a">discussions, or test designs</text><text x="80" y="1010" font-family="Georgia,serif" font-size="20" fill="#22303a">And it does it in minutes—not days.</text><text x="80" y="1060" font-family="Georgia,serif" font-size="20" fill="#22303a">A Real Example: The Dashboard Problem</text></svg>
