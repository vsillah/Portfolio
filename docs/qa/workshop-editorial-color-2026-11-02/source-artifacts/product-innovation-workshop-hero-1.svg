<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">ClientQ: Jobs from Noise</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">What ClientQ Actually Does</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">Whether you feed it one quote or a spreadsheet full</text><text x="80" y="255" font-family="Georgia,serif" font-size="32" fill="#22303a">of comments, ClientQ:</text><text x="80" y="335" font-family="Georgia,serif" font-size="32" fill="#22303a">1. Ingests raw feedback</text><text x="80" y="415" font-family="Georgia,serif" font-size="32" fill="#22303a">Surveys, transcripts, tickets, NPS comments—anything</text><text x="80" y="455" font-family="Georgia,serif" font-size="32" fill="#22303a">textual</text><text x="80" y="535" font-family="Georgia,serif" font-size="32" fill="#22303a">2. Extracts job steps and desired outcomes</text><text x="80" y="615" font-family="Georgia,serif" font-size="32" fill="#22303a">Translates &quot;this is confusing&quot; into &quot;minimize time</text><text x="80" y="655" font-family="Georgia,serif" font-size="32" fill="#22303a">spent understanding how to X&quot;</text><text x="80" y="735" font-family="Georgia,serif" font-size="32" fill="#22303a">3. Sorts outcomes by type</text></svg>
