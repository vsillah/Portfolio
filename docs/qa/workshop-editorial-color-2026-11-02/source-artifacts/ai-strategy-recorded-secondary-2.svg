<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Learning Plan Framework</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="22" fill="#22303a">What a Learning Plan Actually Is</text><text x="80" y="190" font-family="Georgia,serif" font-size="22" fill="#22303a">Think of it as a decision rehearsal—you're planning</text><text x="80" y="217.5" font-family="Georgia,serif" font-size="22" fill="#22303a">your next moves before you know the results.</text><text x="80" y="272.5" font-family="Georgia,serif" font-size="22" fill="#22303a">It's not a template you fill out to satisfy the</text><text x="80" y="300" font-family="Georgia,serif" font-size="22" fill="#22303a">process. It's a thinking tool that forces clarity</text><text x="80" y="327.5" font-family="Georgia,serif" font-size="22" fill="#22303a">about:</text><text x="80" y="382.5" font-family="Georgia,serif" font-size="22" fill="#22303a">● What we believe will happen (hypothesis)</text><text x="80" y="437.5" font-family="Georgia,serif" font-size="22" fill="#22303a">● How we'll know if we're right (metrics)</text><text x="80" y="492.5" font-family="Georgia,serif" font-size="22" fill="#22303a">● What we'll do if we're wrong (pivot options)</text><text x="80" y="547.5" font-family="Georgia,serif" font-size="22" fill="#22303a">● What we'll learn either way (capture mechanism)</text><text x="80" y="602.5" font-family="Georgia,serif" font-size="22" fill="#22303a">When done right, a Learning Plan turns every</text><text x="80" y="630" font-family="Georgia,serif" font-size="22" fill="#22303a">experiment into an institutional asset, not just a</text><text x="80" y="657.5" font-family="Georgia,serif" font-size="22" fill="#22303a">one-time test.</text><text x="80" y="712.5" font-family="Georgia,serif" font-size="22" fill="#22303a">The Ten Components</text><text x="80" y="767.5" font-family="Georgia,serif" font-size="22" fill="#22303a">Here's what goes into a solid Learning Plan:</text><text x="80" y="822.5" font-family="Georgia,serif" font-size="22" fill="#22303a">1. Business Problem / Customer Outcome</text><text x="80" y="877.5" font-family="Georgia,serif" font-size="22" fill="#22303a">Start here. Not with the feature. Not with the shiny</text><text x="80" y="905" font-family="Georgia,serif" font-size="22" fill="#22303a">idea. But with the why.</text><text x="80" y="960" font-family="Georgia,serif" font-size="22" fill="#22303a">Ask:</text><text x="80" y="1015" font-family="Georgia,serif" font-size="22" fill="#22303a">● What business goal are we serving? (Revenue?</text><text x="80" y="1042.5" font-family="Georgia,serif" font-size="22" fill="#22303a">Retention? Acquisition?)</text></svg>
