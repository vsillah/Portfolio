<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Learning Plan Framework</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="32" fill="#22303a">The Ten Components</text><text x="80" y="215" font-family="Georgia,serif" font-size="32" fill="#22303a">Here's what goes into a solid Learning Plan:</text><text x="80" y="295" font-family="Georgia,serif" font-size="32" fill="#22303a">1. Business Problem / Customer Outcome</text><text x="80" y="375" font-family="Georgia,serif" font-size="32" fill="#22303a">Start here. Not with the feature. Not with the shiny</text><text x="80" y="415" font-family="Georgia,serif" font-size="32" fill="#22303a">idea. But with the why.</text><text x="80" y="495" font-family="Georgia,serif" font-size="32" fill="#22303a">Ask:</text><text x="80" y="575" font-family="Georgia,serif" font-size="32" fill="#22303a">● What business goal are we serving? (Revenue?</text><text x="80" y="615" font-family="Georgia,serif" font-size="32" fill="#22303a">Retention? Acquisition?)</text></svg>
