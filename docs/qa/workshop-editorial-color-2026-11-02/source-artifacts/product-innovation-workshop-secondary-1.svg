<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">VisionScope + MarketCraft</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="20" fill="#22303a">The Tools: VisionScope + MarketCraft</text><text x="80" y="185" font-family="Georgia,serif" font-size="20" fill="#22303a">These tools don't just clean your pitch. They</text><text x="80" y="210" font-family="Georgia,serif" font-size="20" fill="#22303a">simulate what your future story will sound</text><text x="80" y="235" font-family="Georgia,serif" font-size="20" fill="#22303a">like—across the org, and in the wild.</text><text x="80" y="285" font-family="Georgia,serif" font-size="20" fill="#22303a">VisionScope — Your Early-Stage Articulation Engine</text><text x="80" y="335" font-family="Georgia,serif" font-size="20" fill="#22303a">Think of it like this:</text><text x="80" y="385" font-family="Georgia,serif" font-size="20" fill="#22303a">&quot;If this were launching next quarter, how would we</text><text x="80" y="410" font-family="Georgia,serif" font-size="20" fill="#22303a">talk about it?&quot;</text><text x="80" y="460" font-family="Georgia,serif" font-size="20" fill="#22303a">VisionScope helps you:</text><text x="80" y="510" font-family="Georgia,serif" font-size="20" fill="#22303a">● Write the press release before you write the PRD</text><text x="80" y="560" font-family="Georgia,serif" font-size="20" fill="#22303a">● Articulate the &quot;why this, why now&quot; in compelling</text><text x="80" y="585" font-family="Georgia,serif" font-size="20" fill="#22303a">language</text><text x="80" y="635" font-family="Georgia,serif" font-size="20" fill="#22303a">● Generate FAQs that surface objections you haven't</text><text x="80" y="660" font-family="Georgia,serif" font-size="20" fill="#22303a">thought of</text><text x="80" y="710" font-family="Georgia,serif" font-size="20" fill="#22303a">● Draft vision narratives that align internal teams</text><text x="80" y="760" font-family="Georgia,serif" font-size="20" fill="#22303a">● Test whether your idea is inspiring or just jargon</text><text x="80" y="810" font-family="Georgia,serif" font-size="20" fill="#22303a">MarketCraft — Your Go-to-Market Pressure Tester</text><text x="80" y="860" font-family="Georgia,serif" font-size="20" fill="#22303a">Think of it as your virtual GTM war room—but faster,</text><text x="80" y="885" font-family="Georgia,serif" font-size="20" fill="#22303a">cheaper, and friendlier.</text><text x="80" y="935" font-family="Georgia,serif" font-size="20" fill="#22303a">MarketCraft helps you:</text><text x="80" y="985" font-family="Georgia,serif" font-size="20" fill="#22303a">● Simulate stakeholder reactions (customers,</text><text x="80" y="1010" font-family="Georgia,serif" font-size="20" fill="#22303a">competitors, analysts)</text><text x="80" y="1060" font-family="Georgia,serif" font-size="20" fill="#22303a">● Test positioning across different segments</text></svg>
