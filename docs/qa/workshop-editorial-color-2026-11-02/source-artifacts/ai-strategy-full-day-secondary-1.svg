<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><text x="80" y="80" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#24333b">Metrics Ladder</text><path d="M80 102 H720" stroke="#a79772" stroke-width="3" opacity=".7"/><text x="80" y="135" font-family="Georgia,serif" font-size="20" fill="#22303a">Build a Metrics Ladder</text><text x="80" y="185" font-family="Georgia,serif" font-size="20" fill="#22303a">The metrics ladder connects the why, what, and how</text><text x="80" y="210" font-family="Georgia,serif" font-size="20" fill="#22303a">of measurement.</text><text x="80" y="260" font-family="Georgia,serif" font-size="20" fill="#22303a">Here's how it works:</text><text x="80" y="310" font-family="Georgia,serif" font-size="20" fill="#22303a">Top of the ladder: Business Value</text><text x="80" y="360" font-family="Georgia,serif" font-size="20" fill="#22303a">What's the strategic outcome we're working toward?</text><text x="80" y="410" font-family="Georgia,serif" font-size="20" fill="#22303a">Examples:</text><text x="80" y="460" font-family="Georgia,serif" font-size="20" fill="#22303a">● Increase annual recurring revenue by 30%</text><text x="80" y="510" font-family="Georgia,serif" font-size="20" fill="#22303a">● Reduce customer acquisition cost by 20%</text><text x="80" y="560" font-family="Georgia,serif" font-size="20" fill="#22303a">● Improve net retention to 110%</text><text x="80" y="610" font-family="Georgia,serif" font-size="20" fill="#22303a">Middle of the ladder: Customer Value</text><text x="80" y="660" font-family="Georgia,serif" font-size="20" fill="#22303a">What behavior change or outcome matters to the user</text><text x="80" y="685" font-family="Georgia,serif" font-size="20" fill="#22303a">that will drive that business value?</text><text x="80" y="735" font-family="Georgia,serif" font-size="20" fill="#22303a">Examples:</text><text x="80" y="785" font-family="Georgia,serif" font-size="20" fill="#22303a">● Users complete their first successful action</text><text x="80" y="810" font-family="Georgia,serif" font-size="20" fill="#22303a">within 3 days</text><text x="80" y="860" font-family="Georgia,serif" font-size="20" fill="#22303a">● Teams collaborate on projects 3x per week (up from</text><text x="80" y="885" font-family="Georgia,serif" font-size="20" fill="#22303a">1x)</text><text x="80" y="935" font-family="Georgia,serif" font-size="20" fill="#22303a">● Users invite colleagues to join (viral coefficient</text><text x="80" y="960" font-family="Georgia,serif" font-size="20" fill="#22303a">&gt;1.2)</text><text x="80" y="1010" font-family="Georgia,serif" font-size="20" fill="#22303a">Bottom of the ladder: Traction Metrics</text><text x="80" y="1060" font-family="Georgia,serif" font-size="20" fill="#22303a">What can the team measure in a sprint to know</text><text x="80" y="1085" font-family="Georgia,serif" font-size="20" fill="#22303a">they're making progress?</text><text x="80" y="1135" font-family="Georgia,serif" font-size="20" fill="#22303a">Examples:</text></svg>
